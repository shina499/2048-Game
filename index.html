<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram.WebApp;

  // اعلام آماده بودن اپ
  tg.ready();

  // اگر میخوای تمام صفحه بشه
  tg.expand();

  // نمونه گرفتن اطلاعات کاربر
  const user = tg.initDataUnsafe?.user;
  console.log(user);

  // تغییر رنگ هدر (اختیاری)
  tg.setHeaderColor("#121212");
</script>
    <title>2048 Game</title>
</head>
<body>

    <div class="title-container">
        <h1 class="title">2048 Game </h1>
    </div>
    
    <div class="score-container">
        <div> score: <span id="current-score">0</span> </div>
        <div> high Score: <span id="high-score">0</span> </div>
    </div>
    <div class="game-container">
        <div class="grid">
            <div class="cell" data-row="0" data-col="0"></div>
            <div class="cell" data-row="0" data-col="1"></div>
            <div class="cell" data-row="0" data-col="2"></div>
            <div class="cell" data-row="0" data-col="3"></div>
            <div class="cell" data-row="1" data-col="0"></div>
            <div class="cell" data-row="1" data-col="1"></div>
            <div class="cell" data-row="1" data-col="2"></div>
            <div class="cell" data-row="1" data-col="3"></div>
            <div class="cell" data-row="2" data-col="0"></div>
            <div class="cell" data-row="2" data-col="1"></div>
            <div class="cell" data-row="2" data-col="2"></div>
            <div class="cell" data-row="2" data-col="3"></div>
            <div class="cell" data-row="3" data-col="0"></div>
            <div class="cell" data-row="3" data-col="1"></div>
            <div class="cell" data-row="3" data-col="2"></div>
            <div class="cell" data-row="3" data-col="3"></div>
        </div>
    </div>

    <div id="game-over">
        Game Over!
        <button id="restart-btn">Restart Game</button>
    </div>

    <div class="footer">
        <p>Made With ❤️ By Niyayesh</p>
    </div>

   <script src="./script.js"></script>
</body>
</html>
